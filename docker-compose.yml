services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartbus
      POSTGRES_PASSWORD: smartbus
      POSTGRES_DB: smartbus
    ports: ["5432:5432"]
    volumes: ["smartbus-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbus -d smartbus"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  smartbus-data:
